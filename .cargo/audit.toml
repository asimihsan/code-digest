# Cargo audit policy for code-digest.
#
# The current Dioxus desktop stack still pulls in GTK3/WebKitGTK crates with
# upstream RustSec advisories that do not yet have a practical fix in the
# supported dependency line used by this repo. We ignore those exact advisory
# IDs so that `cargo audit` stays actionable: any new advisory outside this
# known set fails the command.

[advisories]
ignore = [
  # GTK3 / WebKitGTK transitive advisories from the current Dioxus desktop stack.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429",
  "RUSTSEC-2024-0384",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2025-0057",
  "RUSTSEC-2026-0002",
  "RUSTSEC-2026-0097",
]

[output]
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true
