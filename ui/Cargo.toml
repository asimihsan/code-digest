[package]
name = "ui"
version = "0.1.0"
authors = ["Asim Ihsan <ssh@sshemail.ihsan.io>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.5", features = ["fullstack"] }
dioxus-cli-config = "0.7.4"
dioxus-fullstack = "0.7.5"
tokio = "1.51.1"
axum = "0.8.8"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
